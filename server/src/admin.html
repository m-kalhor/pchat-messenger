<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت سپن</title>
<style>
.masked{-webkit-text-security:disc;text-security:disc}
:root{--bg:#0f1720;--card:#17212b;--line:#243140;--text:#e8eef5;--mut:#8aa0b5;--pri:#3390ec;--red:#e5484d;--grn:#30a46c}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px}
nav button{background:var(--card);color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--pri);border-color:var(--pri)}
main{padding:0 18px 90px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;overflow-x:auto}
h3{margin:0 0 10px;font-size:15px}
input[type=text],input[type=password],input[type=number],input:not([type]){background:#0f1720;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:120px}
button{font-family:inherit}
button.pri,button.red,button.grn,button.sec{border:0;color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer}
button.pri{background:var(--pri)} button.red{background:var(--red)} button.grn{background:var(--grn)} button.sec{background:#2c3b4c}
button:disabled{opacity:.5;cursor:default}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chip{background:#0f1720;border:1px solid var(--line);border-radius:14px;padding:3px 9px;display:inline-flex;gap:4px;align-items:center;margin:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#556;margin-left:6px}.dot.on{background:var(--grn)}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
canvas{width:100%;height:150px;background:#0f1720;border-radius:8px;display:block}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px}.kv div{background:#0f1720;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.kv b{display:block;font-size:16px;margin-top:2px}
#login{max-width:340px;margin:12vh auto;text-align:center}
.err{color:#ff8b8b;min-height:20px;margin-top:8px}
.chg{background:rgba(229,160,58,.18)!important;border-color:#e5a03a!important}
.cell{width:30px;height:26px;border-radius:6px;border:1px solid var(--line);background:#0f1720;color:var(--text);cursor:pointer;font-size:14px;padding:0}
.cell.on{background:var(--grn);border-color:var(--grn);color:#fff}.cell.blk{background:#3a1d22;border-color:var(--red)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 18px;z-index:5}
.savebar.on{border-top-color:#e5a03a}
.savebar .in{max-width:1200px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .cnt{flex:1;color:var(--mut)}.savebar.on .cnt{color:#e5a03a}
.two{display:grid;grid-template-columns:minmax(240px,1fr) 2fr;gap:14px;align-items:start}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.ulist{max-height:65vh;overflow-y:auto;margin-top:8px}
.urow{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.urow:hover{background:#0f1720}.urow.sel{background:#1d3550;border-color:var(--pri);outline:2px solid var(--pri)}
.urow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow .nm small{color:var(--mut);margin-right:6px}
.cnt2{color:var(--mut);font-size:12px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:#0f1720;color:var(--mut);border:0;padding:5px 10px;cursor:pointer;font-size:13px}
.seg button+button{border-right:1px solid var(--line)}
.seg button.on.c{background:var(--grn);color:#fff}.seg button.on.n{background:#2c3b4c;color:#fff}.seg button.on.b{background:var(--red);color:#fff}
.filt button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:14px;padding:3px 10px;cursor:pointer}
.filt button.on{border-color:var(--pri);color:var(--text)}
select{background:#0f1720;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px}
.leg span{display:inline-block;margin-left:12px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:4px}
.srt th{cursor:pointer;user-select:none}.srt th:hover{color:var(--text)}.srt th.on{color:var(--pri)}
.srt td.n{direction:ltr;text-align:right}.srt tr.tot td{font-weight:bold;border-top:2px solid var(--line)}
.bar{height:4px;background:var(--pri);border-radius:2px;margin-top:3px;min-width:1px}
.tag{font-size:11px;background:#3a1d22;color:#ff8b8b;border-radius:6px;padding:1px 6px;margin-right:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var csrf=null,S=null,tab='users',timer=null,admin=null;
var app=document.getElementById('app');

function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value')e.value=v;
    else if(k==='checked')e.checked=!!v;
    else if(k==='disabled')e.disabled=!!v;
    else e.setAttribute(k,v);}
  for(var i=2;i<arguments.length;i++){add(e,arguments[i]);}
  return e;
}
function add(e,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){add(e,x);});return;}
  e.appendChild((typeof c==='string'||typeof c==='number')?document.createTextNode(String(c)):c);
}
async function api(method,path,body){
  var r=await fetch('/admin/api'+path,{method:method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF':csrf||''},body:body?JSON.stringify(body):undefined});
  var j={};try{j=await r.json();}catch(e){}
  if(!r.ok){if(r.status===401&&path!=='/login'){csrf=null;showLogin();}throw new Error(j.error||('HTTP '+r.status));}
  return j;
}
var ERR={ugroups_off:'ساخت گروه توسط کاربران خاموش است',bad_ugroup_settings:'مقدار نامعتبر (سقف هر کاربر ۰ تا ۵۰، اعضا ۲ تا ۱۰۰۰)',no_such_group:'این گروه دیگر نیست',not_member:'این کاربر عضو گروه نیست',bad_role:'نقش نامعتبر',bad_gcall_settings:'مقدار نامعتبر (حداکثر نفرات ۲ تا ۸، تماس هم‌زمان ۱ تا ۵۰)',bad_call_settings:'مقدار نامعتبر (پینگ ۱۰۰ تا ۵۰۰۰، افت ۱ تا ۵۰، بیت‌ریت ۰ تا ۲۰۰۰۰)',bad_login:'نام کاربری، رمز یا کد اشتباه است',bad_password:'رمز اشتباه است',rate_limited:'تلاش زیاد؛ ۱۵ دقیقه صبر کنید',bad_code:'کد اشتباه است یا وقتش گذشته؛ کد تازه را بزنید',bad_password_or_code:'رمز یا کد اشتباه است',totp_not_started:'دوباره از «فعال کردن» شروع کنید',admin_password_not_set:'رمز ادمین تنظیم نشده (msgadmin adminpw)',invalid_username:'نام کاربری نامعتبر است',user_exists:'این کاربر وجود دارد',name_exists:'این نام تکراری است',bad_name:'نام نامعتبر است',invalid_cron:'عبارت cron نامعتبر است',bad_current_password:'رمز فعلی اشتباه است',bad_admin_username:'نام کاربری مدیر باید ۳ تا ۳۲ حرف از a-z ، 0-9 ، _ . - باشد',weak_password:'رمز جدید باید دست‌کم ۸ نویسه باشد',no_such_user:'این کاربر دیگر وجود ندارد',bad_pair:'ارتباط نامعتبر',bad_phone:'شمارهٔ موبایل نامعتبر است (فقط رقم، ۷ تا ۱۵ رقم)',duplicate_phone:'یک شمارهٔ موبایل برای دو کاربر ثبت شده',bad_sms_provider:'سرویس‌دهندهٔ پیامک ناشناخته است',bad_sms_token:'توکن API نامعتبر است',bad_sms_from:'شمارهٔ خط ارسال فقط رقم (با + در ابتدا)',bad_sms_pattern:'کد الگو فقط حروف لاتین، رقم، - و _',bad_sms_param:'نام متغیر فقط حروف لاتین، رقم و _',sms_no_credit:'این سرویس‌دهنده نمایش اعتبار ندارد',sms_foreign_number:'پیامک فقط به شماره‌های ایران فرستاده می‌شود',not_an_apk:'این فایل APK نیست',too_large:'فایل بیش از ۲۰۰ مگابایت است',bad_category:'این دسته وجود ندارد',bad_text:'متن خیلی بلند است',sms_not_configured:'تنظیمات پیامک کامل نیست',timeout:'سرور به سرویس پیامک نرسید (پایان مهلت)',bad_sticker:'تصویر پذیرفته نشد (فقط عکس ثابت تا ۵۱۲×۵۱۲)',sticker_too_large:'حجم تصویر زیاد است',pack_full:'پک پر است (۵۰۰)',bad_title:'نام پک را بنویسید',bad_limit:'عدد خارج از محدوده است',no_such_pack:'این پک دیگر نیست',not_zip:'فایل zip خوانده نشد'};
function msg2(e){return e?(ERR[e]||e):'';}
function msg(e){return ERR[e.message]||e.message;}
function fmtB(n){if(n<1024)return n.toFixed(0)+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB';}
function fmtDur(s){s=Math.floor(s);var d=Math.floor(s/86400),hh=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+' روز ':'')+hh+' ساعت '+m+' دقیقه';}
function fmtDate(t){return t?new Date(t).toLocaleString('fa-IR'):'—';}

// ---------------- unsaved changes (one "save all" button for every tab) ----------------
var P={users:{},cats:{},links:{},backup:null},bar=null;
function sameList(a,b){a=a.slice().sort();b=b.slice().sort();return a.length===b.length&&a.every(function(x,i){return x===b[i];});}
function userOf(n){return S.users.find(function(u){return u.username===n;});}
function pendUser(n,key,val){
  var u=userOf(n),p=P.users[n]||{};
  var orig=u[key];
  if(key==='categories'?sameList(val,orig):val===orig)delete p[key];else p[key]=val;
  if(Object.keys(p).length)P.users[n]=p;else delete P.users[n];
  updateBar();
}
function curUser(n,key){var p=P.users[n];return p&&key in p?p[key]:userOf(n)[key];}
function pendCat(id,name){var c=S.categories.find(function(x){return x.id===id;});if(name===c.name)delete P.cats[id];else P.cats[id]=name;updateBar();}
var visSet={};
// a pair of users is connected (true: both can start a chat), not connected (false) or closed ('block':
// no chat and no connection requests between the two). It is always the same both ways.
function pairK(a,b){return a<b?a+'|'+b:b+'|'+a;}
function origLink(a,b){
  var x=visSet[a+'>'+b],y=visSet[b+'>'+a];
  return x==='block'||y==='block'?'block':x===true||y===true;
}
function curLink(a,b){var k=pairK(a,b);return k in P.links?P.links[k]:origLink(a,b);}
function setLink(a,b,st){if(a===b)return;var k=pairK(a,b);if(st===origLink(a,b))delete P.links[k];else P.links[k]=st;}
function dirty(){var n=Object.keys(P.cats).length+Object.keys(P.links).length+(P.backup?1:0);for(var k in P.users)n+=Object.keys(P.users[k]).length;return n;}
function prune(){ // drop pending edits of users/categories that were deleted meanwhile
  for(var n in P.users)if(!userOf(n))delete P.users[n];
  for(var id in P.cats)if(!S.categories.some(function(c){return String(c.id)===id;}))delete P.cats[id];
  for(var k in P.links){var a=k.split('|');if(!userOf(a[0])||!userOf(a[1]))delete P.links[k];}
  visSet={};S.visibility.forEach(function(p){visSet[p[0]+'>'+p[1]]=true;});(S.blocks||[]).forEach(function(p){visSet[p[0]+'>'+p[1]]='block';});
}
function updateBar(){
  if(!bar)return;var n=dirty();
  bar.cnt.textContent=n?n+' تغییر ذخیره‌نشده':'همهٔ تغییرات ذخیره شده است';
  bar.save.disabled=!n;bar.undo.disabled=!n;bar.el.className='savebar'+(n?' on':'');
}
async function saveAll(){
  var body={users:P.users,categories:P.cats,links:Object.keys(P.links).map(function(k){var a=k.split('|');return [a[0],a[1],P.links[k]];})};
  if(P.backup)body.backup=P.backup;
  bar.save.disabled=true;bar.save.textContent='در حال ذخیره…';
  try{await api('POST','/save',body);P={users:{},cats:{},links:{},backup:null};await reload();}
  catch(e){alert(msg(e));}
  finally{bar.save.textContent='ذخیرهٔ همهٔ تغییرات';updateBar();}
}
function confirmDiscard(){return !dirty()||confirm('تغییرات ذخیره‌نشده دور ریخته شود؟');}
window.addEventListener('beforeunload',function(ev){if(csrf&&dirty()){ev.preventDefault();ev.returnValue='';}});

async function showLogin(){
  clearInterval(timer);bar=null;
  var un=h('input',{type:'text',placeholder:'نام کاربری',value:'admin',autocomplete:'username',style:'direction:ltr'});
  var pw=h('input',{type:'password',placeholder:'رمز',autocomplete:'current-password'}),er=h('div',{class:'err'});
  // 1.18: with the second factor on, the 6-digit code from the authenticator app as well
  var need=false;try{need=!!(await api('GET','/login-info')).totp;}catch(e){}
  var code=h('input',{type:'text',inputmode:'numeric',autocomplete:'one-time-code',maxlength:'6',placeholder:'کد ۶ رقمی برنامهٔ Authenticator',style:'direction:ltr;text-align:center;letter-spacing:4px'});
  var go=async function(){er.textContent='';try{var j=await api('POST','/login',{username:un.value,password:pw.value,code:need?code.value:undefined});csrf=j.csrf;admin=j.username;start();}catch(e){er.textContent=msg(e);code.value='';}};
  pw.addEventListener('keydown',function(ev){if(ev.key==='Enter'){if(need&&!code.value)code.focus();else go();}});
  code.addEventListener('keydown',function(ev){if(ev.key==='Enter')go();});
  app.replaceChildren(h('div',{id:'login',class:'card'},h('h3',null,'ورود به پنل مدیریت'),un,h('div',{style:'height:8px'}),pw,
    need?h('div',{style:'height:8px'}):null,need?code:null,h('div',{style:'height:10px'}),h('button',{class:'pri',onclick:go},'ورود'),er));
  pw.focus();
}
async function start(){
  try{S=await api('GET','/state');}catch(e){return;}
  prune();render();
}
async function reload(){S=await api('GET','/state');prune();render();}

function render(){
  clearInterval(timer);
  var tabs=[['users','کاربران'],['cats','دسته‌ها و گروه‌ها'],['links','ارتباط کاربران'],['login','ورود، پیامک و تماس'],['stk','استیکرها'],['ugr','گروه‌ها و کانال‌های کاربران'],['use','مصرف کاربران'],['mon','منابع سرور'],['bak','پشتیبان‌گیری'],['acct','حساب مدیر']];
  var nav=h('nav',null,tabs.map(function(t){return h('button',{class:t[0]===tab?'on':'',onclick:function(){tab=t[0];render();}},t[1]);}));
  var box=h('main');
  var cnt=h('span',{class:'cnt'}),save=h('button',{class:'grn',onclick:saveAll},'ذخیرهٔ همهٔ تغییرات');
  var undo=h('button',{class:'sec',onclick:function(){if(!confirm('همهٔ تغییرات ذخیره‌نشده لغو شود؟'))return;P={users:{},cats:{},links:{},backup:null};render();}},'لغو تغییرات');
  bar={el:h('div',{class:'savebar'},h('div',{class:'in'},cnt,undo,save)),cnt:cnt,save:save,undo:undo};
  app.replaceChildren(
    h('header',null,h('h1',null,'پنل مدیریت سپن'),h('span',{class:'mut'},admin||''),h('button',{class:'sec',onclick:async function(){if(!confirmDiscard())return;try{await api('POST','/logout');}catch(e){}csrf=null;P={users:{},cats:{},links:{},backup:null};showLogin();}},'خروج')),
    nav,smsAlert,box,bar.el);
  ({users:users,cats:cats,links:links,login:loginTab,stk:stickersTab,ugr:ugroupsTab,use:usageTab,mon:monitor,bak:backups,acct:account})[tab](box);
  checkSms();
  updateBar();
}
// a red line under the tabs while the newest SMS attempt failed (users then need a device or admin code)
var smsAlert=h('div');
async function checkSms(){
  try{var A=await api('GET','/auth');
    smsAlert.replaceChildren(A.ready&&A.status.down?h('div',{class:'card',style:'margin:0 18px 14px;border-color:var(--red);background:#3a1d22'},
      '⚠️ ارسال پیامک ناموفق است ('+msg2(A.status.last_error.error)+' — '+fmtDate(A.status.last_error.t)+'). کاربران می‌توانند با کد از دستگاه دیگرشان یا با «کد ورود» از همین پنل (زبانهٔ کاربران) وارد شوند.'):'');
  }catch(e){}
}
function guard(fn){return async function(){try{await fn();}catch(e){alert(msg(e));}};}

// ---------------- users ----------------
function users(box){
  var un=h('input',{placeholder:'نام کاربری (a-z ، 0-9 ، _)'}),dn=h('input',{placeholder:'نام نمایشی (اختیاری)'});
  var chk={},cb=h('span');
  S.categories.forEach(function(c){var x=h('input',{type:'checkbox'});chk[c.id]=x;cb.appendChild(h('label',{class:'chip'},x,c.name));});
  box.appendChild(h('div',{class:'card'},h('h3',null,'افزودن کاربر'),h('div',{class:'row'},un,dn,cb,
    h('button',{class:'pri',onclick:guard(async function(){
      var ids=S.categories.filter(function(c){return chk[c.id].checked;}).map(function(c){return c.id;});
      var j=await api('POST','/users',{username:un.value.trim(),display_name:dn.value,categories:ids});
      prompt('رمز کاربر '+un.value.trim()+' (فقط همین یک‌بار نمایش داده می‌شود):',j.password);
      await reload();})},'ایجاد'))));
  var head=h('tr',null,h('th',null,'کاربر'),h('th',null,'نام نمایشی'),h('th',null,'موبایل'),S.categories.map(function(c){return h('th',null,c.name);}),h('th',{title:'نمایش پینگ و مسیر در تماس (آزمایشی)'},'📶 پینگ'),h('th',{title:'کاربر بتواند در تماس مسیر اتصال را خودش انتخاب کند (مستقیم یا از طریق سرور با UDP/TCP/TLS)'},'🔀 مسیر تماس'),h('th',null,''));
  // 1.8: call diagnostics per user; the same list as the «عیب‌یابی تماس» card, saved at once
  function diagBox(u){
    var x=h('input',{type:'checkbox',checked:!!u.diag});
    x.addEventListener('change',guard(async function(){
      var list=S.users.filter(function(v){return v.username===u.username?x.checked:v.diag;}).map(function(v){return v.username;});
      try{await api('POST','/auth',{diag_users:list.join(',')});u.diag=x.checked;}catch(e){x.checked=!x.checked;alert(msg(e));}}));
    return x;}
  // 1.15: who may choose the call path in a call; nobody unless ticked here, saved at once
  function routeBox(u){
    var x=h('input',{type:'checkbox',checked:!!u.route});
    x.addEventListener('change',guard(async function(){
      var list=S.users.filter(function(v){return v.username===u.username?x.checked:v.route;}).map(function(v){return v.username;});
      try{await api('POST','/auth',{route_users:list.join(',')});u.route=x.checked;}catch(e){x.checked=!x.checked;alert(msg(e));}}));
    return x;}
  var rows=S.users.map(function(u){
    var name=h('input',{value:curUser(u.username,'display_name'),placeholder:'—'});
    if(P.users[u.username]&&'display_name' in P.users[u.username])name.classList.add('chg');
    name.addEventListener('input',function(){pendUser(u.username,'display_name',name.value);name.classList.toggle('chg',name.value!==u.display_name);});
    var ph=h('input',{value:curUser(u.username,'phone'),placeholder:'—',style:'direction:ltr;min-width:130px',inputmode:'tel'});

// ---------------- monitoring ----------------
function chart(cv,series,max,fmt){
  var dpr=window.devicePixelRatio||1,w=cv.clientWidth,hh=cv.clientHeight;
  cv.width=w*dpr;cv.height=hh*dpr;
  var g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,w,hh);
  g.strokeStyle='#243140';g.lineWidth=1;
  for(var i=0;i<=4;i++){var y=Math.round((hh-1)*i/4)+.5;g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
  var n=series[0].data.length;
  series.forEach(function(s){
    g.strokeStyle=s.color;g.lineWidth=2;g.beginPath();
    s.data.forEach(function(v,i){var x=n<2?0:i*(w/(n-1));var y=hh-2-(Math.min(v,max)/max)*(hh-4);if(i===0)g.moveTo(x,y);else g.lineTo(x,y);});
    g.stroke();});
  g.fillStyle='#8aa0b5';g.font='11px sans-serif';g.fillText(fmt(max),4,12);g.fillText('0',4,hh-4);
}

      h('td',null,h('button',{class:'sec',onclick:function(){stkOpen=stkOpen===p.id?null:p.id;render();}},stkOpen===p.id?'بستن':'باز کردن'),' ',
        h('button',{class:'red',onclick:guard(async function(){if(!confirm('پک «'+p.title+'» برای همه حذف شود؟ استیکرهای فرستاده‌شده «حذف شده» نشان داده می‌شوند.'))return;await api('POST','/stickers/pack/'+p.id+'/delete');if(stkOpen===p.id)stkOpen=null;render();})},'حذف')));
  });
  box.appendChild(h('div',{class:'card'},h('h3',null,'همهٔ پک‌ها'),D.packs.length?h('table',null,h('tr',null,h('th',null,'نام'),h('th',null,'سازنده'),h('th',null,'تعداد'),h('th',null,'حجم'),h('th',null,'کاربرانی که افزوده‌اند'),h('th',null,'')),rows):h('div',{class:'mut'},'هنوز پکی نیست')));
  if(!stkOpen)return;
  var P;try{P=await api('GET','/stickers/pack/'+stkOpen);}catch(e){stkOpen=null;return;}
  var file=h('input',{type:'file',multiple:true,accept:'image/png,image/webp,image/jpeg,.zip'}),st=h('span',{class:'mut'});
  var grid=h('div',{style:'display:flex;flex-wrap:wrap;gap:8px'},P.stickers.map(function(s){
    return h('div',{style:'text-align:center'},h('img',{src:'/admin/api/stickers/sticker/'+s.id,style:'width:96px;height:96px;object-fit:contain;background:#0f1720;border-radius:8px;display:block'}),
      h('a',{href:'#',style:'color:#ff8b8b;font-size:12px',onclick:guard(async function(e){e.preventDefault();if(!confirm('این استیکر حذف شود؟'))return;await api('POST','/stickers/sticker/'+s.id+'/delete');render();})},'حذف'));
  }));
  var rn=h('input',{value:P.title});
  box.appendChild(h('div',{class:'card'},h('h3',null,'پک «'+P.title+'»'+(P.official?'':' (ساختهٔ کاربر)')),
    h('div',{class:'row'},rn,h('button',{class:'sec',onclick:guard(async function(){await api('POST','/stickers/pack/'+P.id+'/rename',{title:rn.value});render();})},'تغییر نام')),
    h('div',{class:'row'},file,h('button',{class:'pri',onclick:async function(){if(!file.files.length)return;try{await stkUpload(P.id,[].slice.call(file.files),st);}catch(e){st.textContent='✗ '+msg(e);}render();}},'افزودن'),st),
    grid));
}

// ---------------- backups ----------------
async function backups(box){
  var B;try{B=await api('GET','/backup');}catch(e){return;}
  var c=P.backup||B.config;
  var en=h('input',{type:'checkbox',checked:c.enabled}),cr=h('input',{value:c.cron,style:'direction:ltr;width:180px'}),kp=h('input',{type:'number',value:c.keep,style:'width:80px'});
  function pend(){var v={enabled:en.checked,cron:cr.value.trim(),keep:Number(kp.value)};
    P.backup=(v.enabled===B.config.enabled&&v.cron===B.config.cron&&v.keep===B.config.keep)?null:v;updateBar();}
  [en,cr,kp].forEach(function(x){x.addEventListener('input',pend);x.addEventListener('change',pend);});
  box.appendChild(h('div',{class:'card'},h('h3',null,'پشتیبان‌گیری زمان‌بندی‌شده از دیتابیس'),
    h('div',{class:'row'},h('label',null,en,' فعال'),h('span',null,'زمان‌بندی (cron):'),cr,h('span',null,'نگه‌داری آخرین'),kp,h('span',null,'نسخه')),
    h('div',{class:'mut'},'نمونه: «0 3 * * *» هر شب ساعت ۳ ، «*/30 * * * *» هر نیم‌ساعت ، «0 */6 * * *» هر ۶ ساعت (به ساعت سرور). با «ذخیرهٔ همهٔ تغییرات» ثبت می‌شود.'),
    h('div',{style:'margin-top:8px'},'اجرای بعدی: ',B.next?fmtDate(B.next):'—','   ·   آخرین پشتیبان: ',fmtDate(B.last))));
  var run=h('button',{class:'grn',onclick:guard(async function(){run.disabled=true;run.textContent='در حال تهیه…';try{await api('POST','/backup/run');}finally{await render();}})},'همین الان پشتیبان بگیر');
  var trs=B.list.map(function(b){
    var del=h('button',{class:'red',onclick:guard(async function(){if(!confirm('حذف شود؟'))return;await api('POST','/backup/delete',{name:b.name});await render();})},'حذف');
    var dl=h('a',{href:'/admin/api/backup/download/'+b.name,style:'color:#6cb4ff'},'دانلود');
    return h('tr',null,h('td',{style:'direction:ltr;text-align:left'},b.name),h('td',null,fmtB(b.size)),h('td',null,fmtDate(b.mtime)),h('td',null,dl,'  ',del));
  });
  var table=h('table',null,h('tr',null,h('th',null,'فایل'),h('th',null,'حجم'),h('th',null,'تاریخ'),h('th',null,'')),trs);
  box.appendChild(h('div',{class:'card'},
    h('div',{class:'row'},h('h3',{style:'margin:0;flex:1'},'پشتیبان‌ها ('+B.list.length+')'),run),
    table,
    h('div',{class:'mut',style:'margin-top:8px'},'پشتیبان فقط دیتابیس را دارد (پیام‌ها رمزشده‌اند). فایل‌های ضمیمه شامل نمی‌شوند.')));
}

// ---------------- admin account ----------------
function account(box){
  var cur=h('input',{type:'password',autocomplete:'current-password',placeholder:'رمز فعلی'});
  var un=h('input',{type:'text',value:admin||'admin',autocomplete:'username',style:'direction:ltr'});
  var p1=h('input',{type:'password',autocomplete:'new-password',placeholder:'رمز جدید (خالی = بدون تغییر)'}),p2=h('input',{type:'password',autocomplete:'new-password',placeholder:'تکرار رمز جدید'});
  var er=h('div',{class:'err'});
  box.appendChild(h('div',{class:'card',style:'max-width:480px'},h('h3',null,'نام کاربری و رمز ورود به پنل'),
    h('div',{class:'row'},h('span',{style:'width:110px'},'نام کاربری'),un),
    h('div',{class:'row'},h('span',{style:'width:110px'},'رمز جدید'),p1),
    h('div',{class:'row'},h('span',{style:'width:110px'},'تکرار رمز'),p2),
    h('div',{class:'row'},h('span',{style:'width:110px'},'رمز فعلی'),cur),
    h('button',{class:'pri',onclick:async function(){
      er.textContent='';
      if(p1.value!==p2.value){er.textContent='رمز جدید و تکرار آن یکی نیستند';return;}
      try{var j=await api('POST','/account',{current:cur.value,username:un.value,password:p1.value});admin=j.username;alert('حساب مدیر به‌روز شد'+(p1.value?'؛ بقیهٔ نشست‌های باز پنل خارج شدند.':''));render();}
      catch(e){er.textContent=msg(e);}
    }},'به‌روزرسانی حساب'),er,
    h('div',{class:'mut',style:'margin-top:8px'},'این بخش برای امنیت با رمز فعلی و دکمهٔ جداگانه ثبت می‌شود. اگر رمز را فراموش کردید، روی سرور «msgadmin adminpw» را اجرا کنید.')));
  totpCard(box);
}
// 1.18: second factor for the panel (Google Authenticator, Microsoft Authenticator, Aegis, ...)
async function totpCard(box){
  var on=false;try{on=!!(await api('GET','/session')).totp;}catch(e){}
  var card=h('div',{class:'card',style:'max-width:480px'}),er=h('div',{class:'err'});
  var inp=function(ph,type){return type?h('input',{type:type,placeholder:ph,autocomplete:'current-password'}):h('input',{type:'text',placeholder:ph,autocomplete:'one-time-code',inputmode:'numeric',maxlength:'6',style:'direction:ltr;text-align:center;letter-spacing:4px'});};
  box.appendChild(card);
  if(on){
    var cur=inp('رمز فعلی','password'),code=inp('کد ۶ رقمی');
    card.append(h('h3',null,'رمز دوم ورود (کد Authenticator)'),h('div',{class:'row'},h('b',{style:'color:#1a7f37'},'✓ روشن است')),
      h('div',{class:'mut'},'برای ورود به پنل، رمز و کد ۶ رقمی برنامه هر دو لازم است.'),
      h('div',{class:'row'},h('span',{style:'width:110px'},'رمز فعلی'),cur),h('div',{class:'row'},h('span',{style:'width:110px'},'کد برنامه'),code),
      h('button',{class:'sec',onclick:async function(){er.textContent='';if(!confirm('رمز دوم خاموش شود؟ پنل دوباره فقط با رمز باز می‌شود.'))return;
        try{await api('POST','/totp/disable',{current:cur.value,code:code.value});alert('رمز دوم خاموش شد');render();}catch(e){er.textContent=msg(e);}}},'خاموش کردن رمز دوم'),er,
      h('div',{class:'mut',style:'margin-top:8px'},'اگر گوشی را گم کردید: روی سرور «msgadmin totp-off» را اجرا کنید و بعد دوباره فعالش کنید.'));
    return;
  }
  var cur2=inp('رمز فعلی','password'),step=h('div');
  card.append(h('h3',null,'رمز دوم ورود (کد Authenticator)'),h('div',{class:'row'},h('b',{style:'color:#b42318'},'خاموش است')),
    h('div',{class:'mut'},'با روشن کردن آن، ورود به پنل علاوه بر رمز، کد ۶ رقمی برنامهٔ Google Authenticator (یا مشابه) روی گوشی شما را هم لازم دارد. پس اگر کسی رمز را بداند هم بدون گوشی شما وارد نمی‌شود.'),
    h('div',{class:'row'},h('span',{style:'width:110px'},'رمز فعلی'),cur2),
    h('button',{class:'pri',onclick:async function(){er.textContent='';
      try{var j=await api('POST','/totp/start',{current:cur2.value});}catch(e){er.textContent=msg(e);return;}
      var code=inp('کد ۶ رقمی');
      step.replaceChildren(h('div',{class:'mut',style:'margin-top:10px'},'۱. در برنامهٔ Authenticator گوشی «+» را بزنید و این QR را اسکن کنید:'),
        h('div',{style:'text-align:center;margin:8px 0'},h('img',{src:j.qr,alt:'QR',style:'width:220px;height:220px;background:#fff;padding:6px;border-radius:8px'})),
        h('div',{class:'mut'},'اگر اسکن نشد، این کلید را دستی وارد کنید:'),h('div',{style:'direction:ltr;font-family:monospace;word-break:break-all;margin:4px 0 10px'},j.secret.replace(/(.{4})/g,'$1 ').trim()),
        h('div',{class:'mut'},'۲. کد ۶ رقمی که برنامه نشان می‌دهد را بنویسید و تأیید کنید:'),
        h('div',{class:'row'},code,h('button',{class:'pri',onclick:async function(){er.textContent='';
          try{await api('POST','/totp/confirm',{code:code.value});alert('رمز دوم روشن شد. از این به بعد ورود به پنل کد برنامه را هم می‌خواهد. بقیهٔ نشست‌های باز پنل خارج شدند.');render();}catch(e){er.textContent=msg(e);}}},'تأیید و روشن کردن')));
      code.focus();
    }},'فعال کردن رمز دوم'),step,er);
}

(async function init(){try{var j=await api('GET','/session');csrf=j.csrf;admin=j.username;start();}catch(e){showLogin();}})();
})();
