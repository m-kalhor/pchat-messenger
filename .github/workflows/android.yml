name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # fixed signing key (repo secrets), so a new APK installs over the old one without uninstalling
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SEPAN_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SEPAN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sepan.jks"
            echo "SEPAN_KEYSTORE=$RUNNER_TEMP/sepan.jks" >> "$GITHUB_ENV"
            echo "SEPAN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the fixed Sepan key"
          else
            echo "::warning::SEPAN_KEYSTORE_B64 secret is not set: the APK is signed with a throwaway debug key and will not install over an older build"
          fi
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Check the APK is signed and not debuggable
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified using|Signer #1 certificate DN|SHA-256"
          if "$BT/aapt" dump badging "$APK" | grep -q "application-debuggable"; then echo "::error::release APK is debuggable"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: sepan-release-apk
          path: android/app/build/outputs/apk/release/*.apk
