name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server & crypto tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check shell scripts parse
        run: for f in server/*.sh; do bash -n "$f"; done
      - name: Run tests
        run: npm test

